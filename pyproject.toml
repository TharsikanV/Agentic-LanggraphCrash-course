description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TharsikanV", email = "108121067+TharsikanV@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-groq>=1.1.3",
